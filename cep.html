<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP (API)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 40px 20px; }
        .formulario { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        input[readonly] { background-color: #e9ecef; color: #666; } /* Deixa os campos preenchidos cinzas */
    </style>
</head>
<body>

    <div class="formulario">
        <h2>Endereço de Entrega 📦</h2>
        
        <label>Digite o CEP (só números)</label>
        <input type="number" id="cep" placeholder="Ex: 01001000" onblur="buscarCEP()">
        
        <label>Rua</label>
        <input type="text" id="rua" readonly placeholder="...">
        
        <label>Bairro</label>
        <input type="text" id="bairro" readonly placeholder="...">
        
        <label>Cidade / Estado</label>
        <input type="text" id="cidade" readonly placeholder="...">
    </div>

    <script>
        // Função que conversa com a API
        function buscarCEP() {
            let cepDigitado = document.getElementById("cep").value;

            // Se o usuário digitou 8 números, fazemos o pedido (fetch)
            if (cepDigitado.length === 8) {
                
                // O FETCH é o nosso "garçom". Mandamos ele ir nesse link gratuito (ViaCEP)
                fetch(`https://viacep.com.br/ws/${cepDigitado}/json/`)
                    
                    // Quando a resposta chegar, transformamos ela em um Objeto JavaScript (JSON)
                    .then(resposta => resposta.json())
                    
                    // Agora pegamos os dados e colocamos nas caixas de texto na tela
                    .then(dados => {
                        if (dados.erro) {
                            alert("CEP não encontrado!");
                        } else {
                            // Preenchendo os inputs automaticamente!
                            document.getElementById("rua").value = dados.logradouro;
                            document.getElementById("bairro").value = dados.bairro;
                            document.getElementById("cidade").value = dados.localidade + " / " + dados.uf;
                        }
                    })
                    
                    // Se a internet cair ou o site do governo estiver fora do ar:
                    .catch(erro => alert("Erro ao buscar o CEP na internet."));
            }
        }
    </script>
</body>
</html>
